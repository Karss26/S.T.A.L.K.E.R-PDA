<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STALKER PDA</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #0a0a0a url('Assets/Emission.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Consolas', monospace;
            color: #00ff00;
            height: 100vh;
            overflow: hidden;
        }

        .pda-frame {
            max-width: 980px;
            margin: 0px auto;
            background: rgba(20, 20, 20, 0.97);
            border: 18px solid #333;
            box-shadow: 0 0 90px rgba(0, 255, 0, 0.4);
            overflow: hidden;
        }

        .tabs { 
            display: flex; 
            background: #111; 
            border-bottom: 3px solid #0f0;
        }
        .tab {
            padding: 12px 22px;
            cursor: pointer;
            border-right: 2px solid #222;
            transition: 0.2s;
        }
        .tab:hover, .tab.active { 
            background: #1f1f1f; 
            color: #0f0; 
            text-shadow: 0 0 8px #0f0; 
        }

        .content { 
            height: 430px; 
            padding: 15px; 
            overflow: hidden; 
        }

        /* Guide Tab */
        .guide-container {
            display: flex;
            height: 100%;
            gap: 10px;
        }
        .guide-left { width: 180px; background: #1a1a1a; padding: 10px; overflow-y: auto; }
        .guide-middle { width: 260px; background: #222; padding: 10px; overflow-y: auto; }
        .guide-right { flex: 1; background: #1f1f1f; padding: 15px; overflow-y: auto; }

        .list-item {
            padding: 6px 8px;
            cursor: pointer;
            margin-bottom: 2px;
        }
        .list-item:hover, .list-item.active {
            background: #0a0a0a;
            color: #0f0;
        }

        .preview-img { width: 100%; border: 2px solid #444; margin-bottom: 12px; }
#detail-desc {
    white-space: pre-wrap;
    line-height: 1.45;
    margin-top: 10px;
    color: #b0ffb0;
}
        /* Relations Table */
#relationsTable th, #relationsTable td {
    padding: 7px 6px;
    border: 1px solid #333;
    white-space: nowrap;
}
#relationsTable th {
    background: #111;
    color: #0f0;
    font-weight: normal;
}
#relationsTable td:first-child {
    text-align: left;
    background: #1a1a1a;
    color: #ccc;
    font-weight: bold;
}
.rel-max, .rel-major, .rel-friend { color: #00ff00; }
.rel-moderate, .rel-minor, .rel-neutral { color: #ffdd00; }
.rel-minimal, .rel-enemy { color: #ff4444; }
    </style>
</head>
<body>
    <div class="pda-frame">
        <!-- Header -->
        <div style="background:#111; padding:10px 20px; display:flex; justify-content:space-between; border-bottom:4px solid #0f0;">
            <div><strong>S.T.A.L.K.E.R. PDA</strong> v1.5.3</div>
            <div id="time">time</div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <div class="tab active" onclick="switchTab(0)">Guide</div>
            <div class="tab" onclick="switchTab(1)">Relations</div>
        </div>

        <!-- GUIDE TAB -->
        <div id="tab-0" class="content">
            <div class="guide-container">
                <!-- Left -->
                <div class="guide-left">
                    <strong>Notes</strong><br><br>
                    <div onclick="loadCategory('anomalies')" class="list-item active">Anomalies</div>
                    <div onclick="loadCategory('mutants')" class="list-item">Mutants</div>
                    <div onclick="loadCategory('factions')" class="list-item">Factions</div>
                    <div onclick="loadCategory('artefacts')" class="list-item">Artefacts</div>
                </div>

                <!-- Middle -->
                <div class="guide-middle" id="entries-list"></div>

                <!-- Right -->
                <div class="guide-right" id="entry-detail">
                    <img src="" class="preview-img" id="detail-image">
                    <strong id="detail-name"></strong><br>
                    <small id="detail-type"></small>
                    <p id="detail-desc"></p>
                </div>
            </div>
        </div>

        <!-- RELATIONS TAB -->

            document.querySelectorAll('.content').forEach(el => el.style.display = 'none');
            document.getElementById('tab-' + n).style.display = 'block';

            document.querySelectorAll('.tab').forEach((tab, index) => {
                tab.classList.toggle('active', index === n);
            });
        }

                { name: "Burner", 
                  type: "Thermal", 
                  desc: "The Burner can be a bit difficult to see, even in daylight, as it's only revealed by a faint heat haze. If the anomaly is triggered by either a living being or an object such as a metal bolt, it shoots out a tall pillar of flame in the air, burning everything in its vicinity.\n\nThough somewhat rare, the Burner anomaly is often found in clusters. Some clusters also emit an extremely high ambient temperature, which cooks anything in their vicinity. Burners can emit temperatures anywhere from 100 degrees Celsius to several thousand - hot enough to crack concrete and melt metal, which explains why some Burners appear in areas that have massive cracks and severely damaged soil, while other sites are untouched.\n\nBurners are very dangerous at high difficulties, and can be extremely dangerous even with top-tier armor. The Burners don't have a set spawn point like other anomalies do, or even a set trigger point. Simply being in the same vicinity can trigger a conflagration.",

                  img: "Assets/Anomalies/Emission.png" },
                { name: "Fruit Punch",
                  type: "Chemical-based",
                  desc: "The Fruit Punch is a puddle of lambent green liquid that easily visible in almost any environment due to its bright glow, and disticttive hissing and bubbling noises. On contact with creatures or objects such as bolts, a Fruit Punch lights up brightly and emits a sharp hissing sound. It is extremely Corrosive, damaging creatures and objects on contact. Any matter left in a Fruit Punch will eventually dissolve, hinting at the anomaly's corrosive nature and spelling doom for any protective suit. For Players, contact with a Fruit Punch will cause damage with each 'flash'. This anomaly is commonly found underground. \n\n Concerning its characteristics, it is generaly accepted that it derives from the remnants of a highly radioactive spill of some reactive substance that gained its anomalous abilities from the Zone. Its corrosive properties are exhibited by its intense and rapid damage to all loving tissue and inorganic matter, metal and plastic alike. \n\n Owing to its ability to spawn artefacts in Shadow of Chernobyl, and not in Clear Sky, it coould be said that the last emission seen in Clear Sky desatbilized the Zone somewhat and dispersed the Gas Anomaly, repalcing it with the Fruit Punch instead. It's fairly common, occurring mostly in buildings and underground complexes, usually isolated spot. \n\n On a few occasions, both Fruit Punch and Gas Anomaliescan be found, and in ome cases they actually seem to merge together. Anomalousactivity and radiation combine to create a deadly blend of both corrosive liquid, directly damaging armor and equipmwnt, and a toxic cloud of poisonous gas that deals direct health and satmina damage. In Cal of Pripyat, the Fruit Punch by itself can only be found very rarely, and as per the norm, only in closed or cofined areas.",
                  img: "Assets/Anomalies/FruitPunch.png" },
            ],
            mutants: [
                { name: "Bloodsucker", type: "Mutant", desc: "Hematophagous predator.", img: "" },
            ],
            factions: [
                { name: "Loners", type: "Faction", desc: "Independent stalkers.", img: "" },
            ],
            artefacts: [
                { name: "Moonlight", type: "Artefact", desc: "Found in Electro anomalies.", img: "" },
            ]
        };

        function loadCategory(cat) {
            document.querySelectorAll('.guide-left .list-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');   // Highlight clicked category

            const list = document.getElementById('entries-list');
            list.innerHTML = '';

            data[cat].forEach(entry => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.textContent = entry.name;
                div.onclick = () => showDetail(entry);
                list.appendChild(div);
            });

            if (data[cat].length > 0) showDetail(data[cat][0]);
        }

        function showDetail(entry) {
            document.getElementById('detail-image').src = entry.img;
            document.getElementById('detail-name').textContent = entry.name;
            document.getElementById('detail-type').textContent = "Type: " + entry.type;
            document.getElementById('detail-desc').textContent = entry.desc;
        }

        // Start with Anomalies
        window.onload = () => loadCategory('anomalies');

    "Loner", "Duty", "Freedom", "Clear Sky",

    "Bandit", "Monolith", "Renegades", "Sin", "UNISG"
];

function getRelClass(value) {
    const v = value.toLowerCase();
    if (["maximal", "major", "friend"].includes(v)) return "rel-max";
    if (["moderate", "minor", "neutral"].includes(v)) return "rel-moderate";
    return "rel-enemy"; // minimal / enemy
}

function buildRelationsTable() {
    const tbody = document.getElementById("relationsBody");
    tbody.innerHTML = "";

    factions.forEach(rowFaction => {
        const tr = document.createElement("tr");

        // Row header
        const th = document.createElement("td");
        th.textContent = rowFaction;
        tr.appendChild(th);

        // Cells
        factions.forEach(colFaction => {
            const td = document.createElement("td");
            const value = relationsData[rowFaction][colFaction] || "Neutral";
            td.textContent = value;
            td.className = getRelClass(value);
            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });
}

function toggleValues() {
    const show = document.getElementById("showValues").checked;
    document.querySelectorAll("#relationsTable td:not(:first-child)").forEach(td => {
        td.style.color = show ? "" : "transparent";
    });
}

// Call this when the Relations tab is opened (or just on load)
document.addEventListener("DOMContentLoaded", () => {
    buildRelationsTable();
});
// Live clock
function updateTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('time').textContent = `${hours}:${minutes}`;
}

// Update immediately and then every second
updateTime();
setInterval(updateTime, 1000);
